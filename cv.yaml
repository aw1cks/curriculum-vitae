projects:
  - name: cpuhint — Linux CPU Discovery Interposition
    url: https://github.com/aw1cks/cpuhint
    keywords:
      - Rust
    startDate: "2026"
    description: >
      Linux LD_PRELOAD shim aligning glibc CPU-discovery interfaces (sched_getaffinity, sysconf,
      get_nprocs) with LXCFS container-visible CPU counts; built with a no_std core, fail-open
      fallbacks, ABI-level tests, and fuzzing.
  - name: estus — Policy-Gated MCP Server for Linux Hosts
    url: https://github.com/aw1cks/estus
    keywords:
      - Rust
      - MCP
      - SSH
    startDate: "2026"
    description: >
      MCP server letting AI agents triage and change Linux hosts over the operator's own OpenSSH
      through typed, tiered tools (observe/inspect/preview/change/exec) instead of a raw shell;
      per-host strictest-wins policy, a reviewed catalog spanning systemd, network, kernel, and
      packages, Ansible modules as offline-bundled typed tools, and write-locking on lost change
      acknowledgements.
  - name: Keycloak — SPNEGO Mutual Authentication
    url: https://github.com/keycloak/keycloak/pull/51560
    keywords:
      - Java
      - Merged upstream
    startDate: "2026"
    description: >
      Fixed final GSSAPI response-token propagation across Kerberos, LDAP, and HTTP authentication
      flows, with integration tests covering mutual authentication and transient credential state.
  - name: openssh-sftp-protocol — Non-UTF-8 Unix Filenames
    url: https://github.com/openssh-rust/openssh-sftp-protocol/pull/31
    keywords:
      - Rust
      - Merged upstream
    startDate: "2026"
    description: >
      Fixed Serde Path decoding and request serialisation rejecting valid non-UTF-8 Unix filenames
      per the SFTP specification, uncovered via fuzz testing.

